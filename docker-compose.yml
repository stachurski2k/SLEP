name: slep

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data  
    command: redis-server --appendonly yes  
    networks:
      - slep-network

  s3:
    image: cgr.dev/chainguard/minio:latest
    container_name: s3
    hostname: s3
    restart: unless-stopped
    ports:
      - 9000:9000 #S3 API
      - 9001:9001 #Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - /mnt/data:/data
    networks:
      - slep-network
    command: server /data --console-address ":9001"

  s3-dev:
    image: cgr.dev/chainguard/minio:latest
    container_name: s3-dev
    hostname: s3
    restart: unless-stopped
    ports:
      - 9000:9000 #S3 API
      - 9001:9001 #Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./tmp/s3-data:/data
    networks:
      - slep-network
    command: server /data --console-address ":9001"

  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: slep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5435:5432
    networks:
      - slep-network
    volumes:
      - postgres-data:/var/lib/postgressql/data

  language-learning-api:
    build:
      context: ./src/language-learning-backend
      dockerfile: Dockerfile
    container_name: language-learning-api
    restart: unless-stopped
    ports:
      - 8000:8000
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/slep
      - ENVIRONMENT=development
    networks:
      - slep-network
    depends_on:
      - postgres

  language-learning-frontend:
    build:
      context: ./src/language-learning-frontend
    container_name: language-learning-frontend
    restart: unless-stopped
    ports:
      - 3001:80   # HTTP -> przekierowanie na HTTPS
      - 3443:443  # HTTPS (wymagane przez kamerę)
    # nginx proxuje /api -> :8000 i /model-service -> :5001 przez host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - language-learning-api
      - model-service
    networks:
      - slep-network

  model-service:
    build:
      context: ./src/model-service
    container_name: model-service
    restart: unless-stopped
    ports:
      - 5001:5001
    volumes:
      - model-service-storage:/app/storage
    networks:
      - slep-network
    # GPU wymaga nvidia-container-toolkit na hoście
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  data-collection-api:
    build:
      context: ./src/data-collection-backend
    container_name: data-collection-api
    restart: unless-stopped
    ports:
      - 5000:5000
    environment:
      - UV_ENVIRONMENT=Development
    networks:
      - slep-network
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 

  data-collection-worker:
    build:
      context: ./src/data-collection-backend
    container_name: data-collection-worker
    restart: unless-stopped
    environment:
      - UV_ENVIRONMENT=Development
    networks:
      - slep-network
    depends_on:
      - redis
    volumes:
      - ./src/data-collection-backend/tmp:/tmp-dir
    command: celery -A app.workers.celery_app worker --loglevel=info
    
  data-collection-flower:  # optional: Worker monitoring UI
    build: 
      context: ./src/data-collection-backend
    command: celery -A app.workers.celery_app flower --port=5555
    ports:
      - 5555:5555
    depends_on:
      - data-collection-worker
    networks:
      - slep-network

  data-collection-frontend:
    container_name: data-collection-frontend
    build:
      context: ./src/data-collection-frontend
    restart: unless-stopped
    ports:
      - 3000:80
    depends_on:
      - data-collection-api
    networks:
      - slep-network

volumes:
  postgres-data:
  redis-data:
  model-service-storage:

networks:
  slep-network:
    driver: bridge
