[project]
name = "model-service"
version = "0.1.0"
description = "FastAPI service that predicts a gesture class from an uploaded video using a trained sequence encoder and a FAISS nearest-neighbor lookup."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.13.1",
    "mediapipe==0.10.35",
    "opencv-python>=4.8",
    "numpy>1.24,<2.0",
    "scipy>=1.10",
    "torch>=2.0.0",
    "faiss-cpu==1.14.2",
    "gdown>=5.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
