name: language-learning

services:
  postgres:
    image: postgres:17
    container_name: language-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: slep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slep"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: language-learning-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/slep
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
